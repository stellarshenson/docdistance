<!--
  10-what-the-numbers-say.svg - results panel for the docdistance article
  Shows: title band, then three labelled bands - MEANING (three cyan stat tiles),
         ARRANGEMENT (three cyan stat tiles), THE COST (one full-width orange tile).
         Every metric is named in plain language, no optimal-transport vocabulary.
  Intent: report the wins and the single regression side by side, at equal weight,
          so the figure cannot be read as a wins-only summary.
  Theme: dark plate #0a1a24; cyan #0096d1 / light cyan #5cc8e0 / dim cyan #1a5a6e
         for improved results; orange #da8230 / light orange #d4a04a for the cost.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" preserveAspectRatio="xMidYMid meet">
  <style>
    .plate { fill: transparent; }
    .bg-grid { fill: #21a0d5; opacity: 0.12; }
    .fg-1 { fill: #0c2d3b; }
    .fg-2 { fill: #193543; }
    .fg-3 { fill: #3d6070; }
    .fg-4 { fill: #4f7080; }
    .accent-1 { fill: #21a0d5; }
    .accent-1-bright { fill: #157285; }
    .accent-2 { fill: #c36c17; }
    .accent-2-bright { fill: #a3751f; }
    .card-cyan { fill: #0096d1; fill-opacity: 0.06; stroke: #2b8bab; stroke-width: 1; }
    .card-cost { fill: #cf7725; fill-opacity: 0.06; stroke: #c36c17; stroke-width: 1.5; }
    .bar-cyan { fill: #21a0d5; }
    .bar-cost { fill: #c36c17; }
    .rule { fill: #2b8bab; }
    .divider { fill: #2b8bab; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #0a1a24; }
      .bg-grid { fill: #2aa9de; opacity: 0.12; }
      .fg-1 { fill: #e2f2f9; }
      .fg-2 { fill: #bcd8e6; }
      .fg-3 { fill: #8fb2c2; }
      .fg-4 { fill: #7fa0b0; }
      .accent-1 { fill: #2aa9de; }
      .accent-1-bright { fill: #7ad7ea; }
      .accent-2 { fill: #e8913c; }
      .accent-2-bright { fill: #e0b25c; }
      .card-cyan { fill: #0096d1; fill-opacity: 0.06; stroke: #23708a; stroke-width: 1; }
      .card-cost { fill: #da8230; fill-opacity: 0.06; stroke: #e8913c; stroke-width: 1.5; }
      .bar-cyan { fill: #2aa9de; }
      .bar-cost { fill: #e8913c; }
      .rule { fill: #23708a; }
      .divider { fill: #23708a; }
    }
  </style>

  <!-- === GRID REFERENCE ===
    viewBox: 1800 x 700 (doc-grid canvas, stat-tile anatomy)
    Outer margins: 40 left/right; content spans x=40..1760 (w=1720)

    Columns (gap=20):
    col-1: x=40..600    w=560
    col-2: x=620..1180  w=560
    col-3: x=1200..1760 w=560
    Text inset 20px from every card left edge: x=60, 640, 1220

    Vertical rhythm (all values on the 5px grid):
    y=40   title baseline / right kicker baseline
    y=60   header hairline rule
    y=90   band A label baseline    tiles y=110..260  h=150
    y=295  band B label baseline    tiles y=315..465  h=150
    y=500  band C label baseline    tile  y=520..670  h=150
    Band label baseline to tile top: 20px. Band gaps: 35px. Bottom margin: 30px.

    In-tile baselines, identical offsets from card top in all three bands:
    +5 accent bar, +35 eyebrow, +90 stat, +130 gloss
    giving 145 / 200 / 240, then 350 / 405 / 445, then 555 / 610 / 650.
    Every text column therefore repeats the same 55 / 40 / 110 gap cycle.
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    h-stack: card-1, card-2, card-3 (gap=20)
    h-stack: card-4, card-5, card-6 (gap=20)
    v-align: card-1.top = card-2.top = card-3.top
    v-align: card-4.top = card-5.top = card-6.top
    h-align: card-1, card-4, card-7 share left edge x=40
    v-spacing: band A tiles, band B tiles, card-7 (equal 35px band gaps)
    contain: card-7 > cost-divider-l, cost-divider-r
    h-align: cost-seg-1, cost-seg-2, cost-seg-3 sit on the col-1 / col-2 / col-3 text insets
    contain: band-a-label + card-1, card-2, card-3
    contain: band-b-label + card-4, card-5, card-6
    contain: band-c-label + card-7
    mirror: card-7 repeats the card-1 tile anatomy at full content width
  === -->

  <rect x="0" y="0" width="1800" height="700" fill="transparent"/>

  <defs>
    <pattern id="grid-pat-100" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="red" stroke-width="0.6"/>
    </pattern>
    <pattern id="grid-pat-20" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="red" stroke-width="0.35"/>
    </pattern>
    <pattern id="grid-pat-5" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="red" stroke-width="0.15"/>
    </pattern>
  </defs>
  <g id="grid-100" display="none"><rect x="0" y="0" width="1800" height="700" fill="url(#grid-pat-100)"/></g>
  <g id="grid-20" display="none"><rect x="0" y="0" width="1800" height="700" fill="url(#grid-pat-20)"/></g>
  <g id="grid-5" display="none"><rect x="0" y="0" width="1800" height="700" fill="url(#grid-pat-5)"/></g>
  <g id="guide-grid" display="none">
    <line x1="40" y1="0" x2="40" y2="700" stroke="red" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="700" stroke="red" stroke-width="0.5"/>
    <line x1="620" y1="0" x2="620" y2="700" stroke="red" stroke-width="0.5"/>
    <line x1="1180" y1="0" x2="1180" y2="700" stroke="red" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="700" stroke="red" stroke-width="0.5"/>
    <line x1="1760" y1="0" x2="1760" y2="700" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="110" x2="1800" y2="110" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="260" x2="1800" y2="260" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1800" y2="315" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="465" x2="1800" y2="465" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="520" x2="1800" y2="520" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="670" x2="1800" y2="670" stroke="red" stroke-width="0.5"/>
  </g>

  <g id="background"><!-- plate, texture, title underline - lowest z -->
    <g id="plate">
      <rect class="plate" x="0" y="0" width="1800" height="700" fill="transparent"/>
    </g>
    <g id="bg-texture" class="bg-grid"><!-- 165px technical grid, 1px fills, no strokes -->
      <rect x="165" y="0" width="1" height="700"/>
      <rect x="330" y="0" width="1" height="700"/>
      <rect x="495" y="0" width="1" height="700"/>
      <rect x="660" y="0" width="1" height="700"/>
      <rect x="825" y="0" width="1" height="700"/>
      <rect x="990" y="0" width="1" height="700"/>
      <rect x="1155" y="0" width="1" height="700"/>
      <rect x="1320" y="0" width="1" height="700"/>
      <rect x="1485" y="0" width="1" height="700"/>
      <rect x="1650" y="0" width="1" height="700"/>
      <rect x="0" y="165" width="1800" height="1"/>
      <rect x="0" y="330" width="1800" height="1"/>
      <rect x="0" y="495" width="1800" height="1"/>
      <rect x="0" y="660" width="1800" height="1"/>
    </g>
    <g id="title-underline">
      <rect class="rule" x="40" y="60" width="1720" height="1"/>
    </g>
  </g>

  <g id="nodes"><!-- stat tiles - card body plus flush accent bar -->
    <g id="card-1">
      <path class="card-cyan" d="M40.0,110.0 H600.0 V256.0 Q600.0,260.0 596.0,260.0 H44.0 Q40.0,260.0 40.0,256.0 Z"/>
      <rect class="bar-cyan" x="40" y="110" width="560" height="5"/>
    </g>
    <g id="card-2">
      <path class="card-cyan" d="M620.0,110.0 H1180.0 V256.0 Q1180.0,260.0 1176.0,260.0 H624.0 Q620.0,260.0 620.0,256.0 Z"/>
      <rect class="bar-cyan" x="620" y="110" width="560" height="5"/>
    </g>
    <g id="card-3">
      <path class="card-cyan" d="M1200.0,110.0 H1760.0 V256.0 Q1760.0,260.0 1756.0,260.0 H1204.0 Q1200.0,260.0 1200.0,256.0 Z"/>
      <rect class="bar-cyan" x="1200" y="110" width="560" height="5"/>
    </g>
    <g id="card-4">
      <path class="card-cyan" d="M40.0,315.0 H600.0 V461.0 Q600.0,465.0 596.0,465.0 H44.0 Q40.0,465.0 40.0,461.0 Z"/>
      <rect class="bar-cyan" x="40" y="315" width="560" height="5"/>
    </g>
    <g id="card-5">
      <path class="card-cyan" d="M620.0,315.0 H1180.0 V461.0 Q1180.0,465.0 1176.0,465.0 H624.0 Q620.0,465.0 620.0,461.0 Z"/>
      <rect class="bar-cyan" x="620" y="315" width="560" height="5"/>
    </g>
    <g id="card-6">
      <path class="card-cyan" d="M1200.0,315.0 H1760.0 V461.0 Q1760.0,465.0 1756.0,465.0 H1204.0 Q1200.0,465.0 1200.0,461.0 Z"/>
      <rect class="bar-cyan" x="1200" y="315" width="560" height="5"/>
    </g>
    <g id="card-7"><!-- the cost: same anatomy, same tile height, full content width -->
      <path class="card-cost" d="M40.0,520.0 H1760.0 V666.0 Q1760.0,670.0 1756.0,670.0 H44.0 Q40.0,670.0 40.0,666.0 Z"/>
      <rect class="bar-cost" x="40" y="520" width="1720" height="5"/>
      <rect class="divider" x="610" y="545" width="1" height="110"/>
      <rect class="divider" x="1190" y="545" width="1" height="110"/>
    </g>
  </g>

  <g id="connectors"><!-- no routed lines in this figure -->
  </g>

  <g id="content"><!-- header, band labels, tile text -->
    <g id="header">
      <text class="fg-1" x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">What the numbers say</text>
      <text class="fg-3" x="1760" y="40" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14">the wins, and the one number that got worse</text>
    </g>

    <g id="band-a-label">
      <text class="accent-1-bright" x="40" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.6">MEANING</text>
      <text class="fg-4" x="135" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">· how much of the content changed</text>
    </g>

    <g id="tile-1-text">
      <text class="fg-3" x="60" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">ranking errors</text>
      <text class="accent-1-bright" x="60" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">0 of 24</text>
      <text class="fg-2" x="60" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14">it never once put a worse summary above a better one</text>
    </g>
    <g id="tile-2-text">
      <text class="fg-3" x="640" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">spread of the scale</text>
      <text class="accent-1-bright" x="640" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">0.057 → 0.180</text>
      <text class="fg-2" x="640" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14">3.2× wider — room to place a threshold</text>
    </g>
    <g id="tile-3-text">
      <text class="fg-3" x="1220" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">safety gap between good and bad summaries</text>
      <text class="accent-1-bright" x="1220" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">+0.92</text>
      <text class="fg-2" x="1220" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14">good summaries sit this far clear of bad ones</text>
    </g>

    <g id="band-b-label">
      <text class="accent-1-bright" x="40" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.6">ARRANGEMENT</text>
      <text class="fg-4" x="185" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">· how much of the order changed</text>
    </g>

    <g id="tile-4-text">
      <text class="fg-3" x="60" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">a pure reword</text>
      <text class="accent-1-bright" x="60" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">0.5%</text>
      <text class="fg-2" x="60" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="14">of what a full scramble reads</text>
    </g>
    <g id="tile-5-text">
      <text class="fg-3" x="640" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">a translation</text>
      <text class="accent-1-bright" x="640" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">0.001</text>
      <text class="fg-2" x="640" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="14">where a full scramble reads far higher</text>
    </g>
    <g id="tile-6-text">
      <text class="fg-3" x="1220" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">agreement with a hand-built ranking</text>
      <text class="accent-1-bright" x="1220" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">1.00</text>
      <text class="fg-2" x="1220" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="14">every pair in the order a person set by hand</text>
    </g>

    <g id="band-c-label">
      <text class="accent-2-bright" x="40" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.6">THE COST</text>
      <text class="fg-4" x="140" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">· what those gains cost</text>
    </g>

    <g id="cost-seg-1">
      <text class="accent-2-bright" x="60" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">↓ the one number that got worse</text>
      <text class="accent-2-bright" x="60" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">2.70 → 2.34</text>
      <text class="fg-2" x="60" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="14">separation between the good and bad groups</text>
    </g>
    <g id="cost-seg-2">
      <text class="fg-3" x="640" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">↑ what it bought</text>
      <text class="fg-1" x="640" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">0.057 → 0.180</text>
      <text class="fg-2" x="640" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="14">the 3.2× wider scale in the tile above</text>
    </g>
    <g id="cost-seg-3">
      <text class="fg-3" x="1220" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.8">the verdict</text>
      <text class="fg-1" x="1220" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="28">an accepted cost</text>
      <text class="fg-2" x="1220" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="14">the spread gain was the better trade</text>
    </g>
  </g>

  <g id="callouts"><!-- no callouts in this figure -->
  </g>
</svg>
